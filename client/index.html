<!DOCTYPE html>
<html>
    <head>
        <title>Health Information System</title>
    </head>
    <body>
        <h1>The Health Information System Demo</h1>

        <h2>Authorization</h2>
        <form name="auth">
            <p>
                <label for="username">Username:</label>
                <input type="text" name="username" id="username" />
            </p>
            <p>
                <label for="passwd">Password:</label>
                <input type="password" name="passwd" id="passwd" />
            </p>
        </form>

        <h2>Add a client</h2>
        <form name="add_client">
            <p>
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" />
            </p>
            <p>
                <label for="second_name">Second Name:</label>
                <input type="text" id="second_name" name="second_name" />
            </p>
            <p>
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" />
            </p>
            <p>
                <label for="dob">Date Of Birth:</label>
                <input type="date" id="dob" name="dob" />
            </p>
            <button type="submit">Submit</button>
        </form>

        <div id="add_client_info"></div>

        <hr />
        <hr />

        <h2>Add a program</h2>
        <form name="add_program">
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" />
            </p>
            <p>
                <label for="description">Description:</label>
                <input type="text" id="description" name="description" />
            </p>
            <p>
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" />
            </p>
            <p>
                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" />
            </p>
            <button type="submit">Submit</button>
        </form>

        <div id="add_program_info"></div>

        <hr />
        <hr />

        <h2>Associate Programs with a client</h2>
        <form name="associate_program">
            <p>
                <label for="associated_client_id">Client Id:</label>
                <input type="text" id="associated_client_id" name="associated_client_id" />
            </p>
            <label for="programs">Enter program ids each in a line</label>
            <br />
            <br />
            <textarea name="programs" id="programs" rows="5" cols="50"> </textarea>
            <br />
            <br />
            <button type="submit">Submit</button>
        </form>

        <div id="associate_program_info"></div>

        <hr />
        <hr />

        <h2>Search Client</h2>
        <form name="search_client">
            <p>
                <label for="q">Enter client name:</label>
                <input name="q" id="q" type="text" />
            </p>
        </form>

        <div id="search_info"></div>

        <hr />
        <hr />

        <h2>Client Profile</h2>
        <form name="profile">
            <p>
                <label for="client_id">Enter client id:</label>
                <input name="client_id" id="client_id" type="text" />
            </p>
        </form>

        <div id="profile_info"></div>

        <script>
            function getAuthHeaders() {
                const username = document.getElementById("username").value;
                const password = document.getElementById("passwd").value;
                return {
                    "Content-Type": "application/json",
                    Authorization: `Basic ${btoa(username + ":" + password)}`,
                };
            }

            function sendPostRequest(url, data) {
                const headers = getAuthHeaders();
                return fetch(url, {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify(data),
                });
            }

            function sendGetRequest(url) {
                const headers = getAuthHeaders();
                return fetch(url, {
                    method: "GET",
                    headers: headers,
                });
            }

            function getAddClientFormData(form) {
                const firstName = form.querySelector("#first_name").value;
                const middleName = form.querySelector("#second_name").value;
                const lastName = form.querySelector("#last_name").value;
                const dob = form.querySelector("#dob").value;

                const [year, month, day] = dob.split("-").map(Number);

                return {
                    first_name: firstName,
                    middle_name: middleName,
                    last_name: lastName,
                    day: day,
                    month: month,
                    year: year,
                };
            }

            function getAddProgramFormData(form) {
                const name = form.querySelector("#name").value;
                const description = form.querySelector("#description").value;
                const start_date = datetime_to_seconds(form.querySelector("#start_date").value);
                const end_date = datetime_to_seconds(form.querySelector("#end_date").value);

                return {
                    name: name,
                    description: description,
                    start_date: start_date,
                    end_date: end_date,
                };
            }

            function datetime_to_seconds(dateString) {
                return Math.floor(new Date(dateString).getTime() / 1000);
            }

            function getClientProgramsFormData(form) {
                const programsRaw = form.querySelector("#programs").value;
                const programLines = programsRaw.split("\n");

                const arrPrograms = programLines.map((line) => line.trim()).filter((line) => line.length > 0);

                return {
                    programs: arrPrograms,
                };
            }

            function handleAddClientFormSubmit(event) {
                event.preventDefault();
                const form = event.target;
                const formData = getAddClientFormData(form);
                const statusDiv = document.getElementById("add_client_info");

                sendPostRequest("http://localhost:2344/client/new", formData)
                    .then((response) => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            return response.json().then((errorData) => {
                                throw new Error(errorData.message || `Request failed with status ${response.status}`);
                            });
                        }
                    })
                    .then((data) => {
                        statusDiv.innerHTML = `<span style="color: green;">Client added successfully! ID: ${data.id}</span>`;
                    })
                    .catch((err) => {
                        statusDiv.innerHTML = `<span style="color: red;">Error adding client: ${err.message}</span>`;
                    });
            }

            function handleAddProgramFormSubmit(event) {
                event.preventDefault();
                const form = event.target;
                const formData = getAddProgramFormData(form);
                const statusDiv = document.getElementById("add_program_info");

                sendPostRequest("http://localhost:2344/program/new", formData)
                    .then((response) => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            return response.json().then((errorData) => {
                                throw new Error(errorData.message || `Request failed with status ${response.status}`);
                            });
                        }
                    })
                    .then((data) => {
                        statusDiv.innerHTML = `<span style="color: green;">Program added successfully! ID: ${data.id}</span>`;
                    })
                    .catch((err) => {
                        statusDiv.innerHTML = `<span style="color: red;">Error adding program: ${err.message}</span>`;
                    });
            }

            function handleClientPrograms(event) {
                event.preventDefault();
                const form = event.target;
                const formData = getClientProgramsFormData(form);
                const statusDiv = document.getElementById("associate_program_info");

                sendPostRequest(`http://localhost:2344/client/${form.querySelector("#associated_client_id").value}`, formData)
                    .then((response) => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            return response.json().then((errorData) => {
                                throw new Error(errorData.message || `Request failed with status ${response.status}`);
                            });
                        }
                    })
                    .then((data) => {
                        statusDiv.innerHTML = `<span style="color: green;">Programs successfully associated with client!</span>`;
                    })
                    .catch((err) => {
                        statusDiv.innerHTML = `<span style="color: red;">Error associating programs: ${err.message}</span>`;
                    });
            }

            function prettyClientProfile(data) {
                const programs = data.programs
                    .map(
                        (program) => `
        <div>
            <strong>Program Name:</strong> ${program.name} <br/>
            <strong>Program ID:</strong> ${program.id} <br/>
        </div>
    `
                    )
                    .join("<hr />");

                return `
        <div style="font-family: Arial, sans-serif; line-height: 1.6;">
            <h3>Client Profile</h3>
            <p><strong>ID:</strong> ${data.id}</p>
            <p><strong>First Name:</strong> ${data.first_name}</p>
            <p><strong>Last Name:</strong> ${data.last_name}</p>
            <h4>Programs:</h4>
            ${programs}
        </div>
    `;
            }

            function handleGetProfile(event) {
                event.preventDefault();
                const client_id = event.target.querySelector("#client_id").value;
                const statusDiv = document.getElementById("profile_info");

                sendGetRequest(`http://localhost:2344/client/${client_id}`)
                    .then((response) => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            return response.json().then((errorData) => {
                                throw new Error(errorData.message || `Request failed with status ${response.status}`);
                            });
                        }
                    })
                    .then((data) => {
                        statusDiv.innerHTML = prettyClientProfile(data);
                    })
                    .catch((err) => {
                        statusDiv.innerHTML = `<span style="color: red;">Error fetching client profile: ${err.message}</span>`;
                    });
            }

            function prettySearchResults(results) {
                return results
                    .map(
                        (client) => `
        <div style="border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; font-family: Arial, sans-serif; border-radius: 5px;">
            <p><strong>ID:</strong> ${client.id}</p>
            <p><strong>First Name:</strong> ${client.first_name}</p>
            <p><strong>Last Name:</strong> ${client.last_name}</p>
        </div>
    `
                    )
                    .join("");
            }

            function handleSearchClient(event) {
                event.preventDefault();
                const query = event.target.querySelector("#q").value;
                const statusDiv = document.getElementById("search_info");

                sendGetRequest(`http://localhost:2344/search/client?q=${query}`)
                    .then((response) => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            return response.json().then((errorData) => {
                                throw new Error(errorData.message || `Request failed with status ${response.status}`);
                            });
                        }
                    })
                    .then((data) => {
                        if (data.length > 0) {
                            statusDiv.innerHTML = `<h3>Search Results:</h3>${prettySearchResults(data)}`;
                        } else {
                            statusDiv.innerHTML = `<p>No clients found matching your query.</p>`;
                        }
                    })
                    .catch((err) => {
                        statusDiv.innerHTML = `<span style="color: red;">Error fetching search results: ${err.message}</span>`;
                    });
            }

            document.forms["add_client"].addEventListener("submit", handleAddClientFormSubmit);
            document.forms["add_program"].addEventListener("submit", handleAddProgramFormSubmit);
            document.forms["associate_program"].addEventListener("submit", handleClientPrograms);
            document.forms["profile"].addEventListener("submit", handleGetProfile);
            document.forms["search_client"].addEventListener("submit", handleSearchClient);
        </script>
    </body>
</html>
